name: Build Exploit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        unzip android-ndk-r29-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV
        echo "$PWD/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
    
    - name: Build Exploit
      run: |
        mkdir -p build/a37-A376BXXS4AZG4
        make TARGET=a37-A376BXXS4AZG4 ANDROID_NDK_HOME=$ANDROID_NDK_HOME release
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: exploit-payload
        path: build/a37-A376BXXS4AZG4/cve-2026-43499-app.release.so
