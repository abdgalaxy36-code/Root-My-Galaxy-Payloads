name: Build A37 Payload

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make clang-17 lld-17

    - name: Set up Android NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r29-linux.zip
        unzip android-ndk-r29-linux.zip
        echo "ANDROID_NDK_HOME=$PWD/android-ndk-r29" >> $GITHUB_ENV

    - name: Build A37 payload
      run: |
        export PATH=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
        make TARGET=a37xq-A376BXXU1AZB7

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: a37-payload
        path: build/a37xq-A376BXXU1AZB7/
